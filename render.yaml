# InfraWatch AI — agent service on Render
# Create from Blueprint, or mirror these fields in the dashboard.
services:
  - type: web
    name: infrawatch-agents
    runtime: python
    rootDir: agents
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
